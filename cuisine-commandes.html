<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ella · Cuisine — Commandes table</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#C75D2C">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ella Cuisine">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">

    <style>
        :root {
            --night: #0E0C0A;
            --charcoal: #1C1A17;
            --charcoal-soft: #14110D;
            --ember-orange: #C75D2C;
            --ember-glow: #E89B40;
            --gold: #D4A661;
            --cream: #EFE4D2;
            --stone-beige: #CBB594;
            --stone-muted: rgba(203, 181, 148, 0.6);
            --green: #5B9B6E;
            --red: #C85A5A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--charcoal);
            color: var(--cream);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh; padding: 1rem;
        }
        header.bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; margin-bottom: 1.5rem;
            background: var(--night);
            border-bottom: 1px solid rgba(212,166,97,0.3);
        }
        h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.6rem; color: var(--cream); }
        .controls { display: flex; gap: 1rem; align-items: center; color: var(--stone-beige); font-size: 0.95rem; }
        .sound-btn {
            background: transparent; border: 1px solid rgba(212,166,97,0.3);
            color: var(--cream); width: 42px; height: 42px;
            cursor: pointer; font-size: 1.1rem; border-radius: 4px;
        }
        .sound-btn:hover { background: rgba(212,166,97,0.1); }

        .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn {
            padding: 0.5rem 1rem; border: 1px solid rgba(212,166,97,0.3);
            background: transparent; color: var(--stone-beige);
            cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 500;
        }
        .filter-btn.active { background: var(--gold); color: var(--charcoal); border-color: var(--gold); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--charcoal-soft);
            border: 2px solid rgba(212,166,97,0.3);
            padding: 1.2rem;
            position: relative;
        }
        .card.nouvelle {
            border-color: var(--ember-orange);
            box-shadow: 0 0 0 1px var(--ember-orange);
            animation: pulse 1.5s infinite;
        }
        .card.en-cours { border-color: var(--gold); opacity: 0.95; }
        .card.servie { opacity: 0.5; border-color: var(--green); }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(199,93,44,0.5); }
            50% { box-shadow: 0 0 0 8px rgba(199,93,44,0); }
        }
        .card-head {
            display: flex; justify-content: space-between; align-items: baseline;
            border-bottom: 1px solid rgba(212,166,97,0.2);
            padding-bottom: 0.7rem; margin-bottom: 0.8rem;
        }
        .table-num {
            font-family: 'Fraunces', serif;
            font-size: 1.6rem; font-weight: 600;
            color: var(--cream);
        }
        .time {
            color: var(--stone-muted);
            font-size: 0.9rem;
        }
        .time.alert { color: var(--red); font-weight: 600; }
        .items { list-style: none; margin: 0 0 0.8rem; padding: 0; }
        .items li {
            color: var(--cream);
            padding: 0.4rem 0;
            border-bottom: 1px dashed rgba(203,181,148,0.1);
            font-size: 1rem;
        }
        .items li:last-child { border: none; }
        .items .qty {
            color: var(--ember-glow);
            font-weight: 700; margin-right: 0.4rem;
            font-size: 1.05rem;
        }
        .note {
            background: rgba(232,155,64,0.1);
            border-left: 3px solid var(--ember-glow);
            padding: 0.6rem 0.8rem; margin-bottom: 0.8rem;
            font-size: 0.9rem; line-height: 1.4;
        }
        .foot {
            display: flex; justify-content: space-between; align-items: center;
            gap: 0.5rem; flex-wrap: wrap;
        }
        .total {
            font-family: 'Fraunces', serif; font-style: italic;
            font-size: 1.3rem; color: var(--ember-glow); font-weight: 500;
        }
        .actions { display: flex; gap: 0.4rem; }
        .btn {
            padding: 0.5rem 0.9rem; border: none;
            cursor: pointer; font-family: inherit;
            font-weight: 600; font-size: 0.85rem;
        }
        .btn-cooking { background: var(--gold); color: var(--charcoal); }
        .btn-cooking:hover { background: var(--ember-glow); }
        .btn-done { background: var(--ember-orange); color: var(--cream); }
        .btn-done:hover { background: #a84d23; }
        .btn-undo {
            background: transparent; color: var(--gold);
            border: 1px solid rgba(212,166,97,0.4);
        }
        .btn-undo:hover { background: rgba(212,166,97,0.1); border-color: var(--gold); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Badge mode (table vs à emporter) */
        .mode-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 7px;
            margin-left: 0.4rem;
            border-radius: 2px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .mode-badge.togo { background: var(--ember-glow); color: var(--charcoal); }
        .mode-badge.table { background: rgba(212,166,97,0.15); color: var(--stone-beige); }

        .empty {
            grid-column: 1 / -1;
            text-align: center; padding: 4rem 2rem;
            color: var(--stone-muted); font-style: italic;
            font-family: 'Fraunces', serif; font-size: 1.1rem;
        }

        /* Séparateur de jour */
        .day-sep {
            grid-column: 1 / -1;
            margin: 1.2rem 0 0.4rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(212,166,97,0.2);
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--gold);
            display: flex; justify-content: space-between; align-items: baseline;
        }
        .day-sep .day-count {
            color: var(--stone-muted);
            font-size: 0.85rem;
            font-style: italic;
        }
        .day-sep:first-child { margin-top: 0; }

        /* Heure sur card */
        .time-detail {
            display: block;
            color: var(--stone-muted);
            font-size: 0.78rem;
            margin-top: 0.15rem;
        }

        /* Panneau total des plats */
        .totals-panel {
            background: var(--charcoal-soft);
            border: 1px solid rgba(212,166,97,0.25);
            margin-bottom: 1.5rem;
        }
        .totals-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.85rem 1.2rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(212,166,97,0.15);
            user-select: none;
        }
        .totals-head:hover { background: rgba(212,166,97,0.05); }
        .totals-head .title {
            font-family: 'Fraunces', serif; font-weight: 500;
            font-size: 1.1rem; color: var(--cream);
        }
        .totals-head .meta {
            color: var(--stone-beige); font-size: 0.85rem;
            margin-left: 0.6rem;
        }
        .totals-head .toggle {
            color: var(--ember-glow); font-size: 0.85rem;
            font-weight: 600;
        }
        .totals-body {
            padding: 1rem 1.2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.4rem 1rem;
        }
        .totals-panel.collapsed .totals-body { display: none; }
        .totals-panel.collapsed .totals-head { border-bottom: none; }
        .totals-row {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 0.4rem 0;
            border-bottom: 1px dashed rgba(203,181,148,0.1);
            gap: 0.6rem;
        }
        .totals-row .name {
            color: var(--cream); font-size: 0.95rem;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .totals-row .qty {
            color: var(--ember-glow); font-weight: 700;
            font-family: 'Fraunces', serif; font-style: italic;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .totals-empty {
            grid-column: 1 / -1;
            color: var(--stone-muted); font-style: italic;
            text-align: center; padding: 0.8rem;
        }

        /* Login overlay */
        .login-overlay {
            position: fixed; inset: 0; background: var(--night);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .login-box {
            background: var(--charcoal-soft); padding: 2.5rem;
            border: 1px solid rgba(212,166,97,0.3);
            width: 100%; max-width: 360px;
            text-align: center;
        }
        .login-box h2 {
            font-family: 'Fraunces', serif; font-size: 1.8rem;
            color: var(--cream); margin-bottom: 1.5rem;
        }
        .login-box p { color: var(--stone-beige); margin-bottom: 1rem; }
        .login-box input {
            width: 100%; padding: 0.9rem;
            background: transparent;
            border: 1px solid rgba(212,166,97,0.3);
            color: var(--cream); font-size: 1rem;
            text-align: center; letter-spacing: 0.2em;
            margin-bottom: 1rem; font-family: inherit;
        }
        .login-box input:focus { outline: none; border-color: var(--ember-glow); }
        .login-box button {
            width: 100%; padding: 0.9rem;
            background: var(--ember-orange); color: var(--cream);
            border: none; font-size: 1rem; cursor: pointer;
            font-family: inherit; font-weight: 600;
        }
        .login-box .err {
            color: var(--ember-orange); margin-top: 0.8rem;
            font-size: 0.9rem; display: none;
        }
        .login-box .err.show { display: block; }
    </style>
</head>
<body>

    <!-- Login overlay -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>Cuisine — Commandes</h2>
            <p style="text-align:left; margin: 0.5rem 0 0.3rem;">Email</p>
            <input type="email" id="email" autocomplete="username" placeholder="staff@ellarestaurant.fr" style="text-align:left; letter-spacing: 0; padding: 0.7rem;">
            <p style="text-align:left; margin: 0.5rem 0 0.3rem;">Mot de passe</p>
            <input type="password" id="pwd" autocomplete="current-password" style="padding: 0.7rem;">
            <button type="button" id="login-btn">Entrer</button>
            <p class="err" id="err">Email ou mot de passe incorrect.</p>
        </div>
    </div>

    <header class="bar">
        <h1>Commandes table — Temps réel</h1>
        <div class="controls">
            <span id="count">0</span>
            <button type="button" class="sound-btn" id="sound-btn" aria-label="Son">🔔</button>
            <button type="button" class="sound-btn" id="logout-btn" aria-label="Déconnexion" title="Déconnexion" style="font-size: 0.85rem;">⎋</button>
        </div>
    </header>

    <div class="filters">
        <button type="button" class="filter-btn active" data-filter="active">En cours</button>
        <button type="button" class="filter-btn" data-filter="all">Toutes (incluant servies)</button>
    </div>

    <section class="totals-panel" id="totals-panel">
        <div class="totals-head" id="totals-head">
            <div>
                <span class="title">Total plats à préparer</span>
                <span class="meta" id="totals-meta">— aucune commande active</span>
            </div>
            <span class="toggle" id="totals-toggle">Masquer ▴</span>
        </div>
        <div class="totals-body" id="totals-body">
            <p class="totals-empty">Pas de plats à préparer.</p>
        </div>
    </section>

    <main class="grid" id="grid">
        <p class="empty">Aucune commande pour le moment.</p>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // ===== Auth (Firebase) =====
        const overlay = document.getElementById('login-overlay');
        const errEl = document.getElementById('err');
        const loginBtn = document.getElementById('login-btn');

        const _firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(_firebaseApp);
        const db = getFirestore(_firebaseApp);
        // Persistance locale : reste connecte apres reload du navigateur
        setPersistence(auth, browserLocalPersistence).catch(() => {});

        onAuthStateChanged(auth, (user) => {
            if (user) {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
            }
        });

        async function tryLogin() {
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('pwd').value;
            if (!email || !pwd) {
                errEl.textContent = 'Email et mot de passe requis.';
                errEl.classList.add('show');
                return;
            }
            errEl.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Connexion…';
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                document.getElementById('pwd').value = '';
            } catch (err) {
                let msg = 'Erreur : ' + (err.message || 'inconnue');
                if (['auth/wrong-password', 'auth/user-not-found', 'auth/invalid-credential', 'auth/invalid-email'].includes(err.code)) {
                    msg = 'Email ou mot de passe incorrect.';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = 'Trop de tentatives. Réessaye dans quelques minutes.';
                } else if (err.code === 'auth/network-request-failed') {
                    msg = 'Problème de réseau. Vérifie ta connexion.';
                }
                errEl.textContent = msg;
                errEl.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrer';
            }
        }
        loginBtn.addEventListener('click', tryLogin);
        document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
        document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('pwd').focus(); });

        // Bouton de déconnexion
        document.getElementById('logout-btn').addEventListener('click', async () => {
            if (!confirm('Se déconnecter ?')) return;
            try { await signOut(auth); } catch (e) { console.error(e); }
        });

        // Firebase déjà initialisé plus haut (auth + db). On récupère les éléments DOM.
        const grid = document.getElementById('grid');
        const countBadge = document.getElementById('count');

        let allOrders = [];
        let filter = 'active';
        let soundOn = true;
        let knownIds = new Set();
        let firstLoad = true;

        document.getElementById('sound-btn').addEventListener('click', (e) => {
            soundOn = !soundOn;
            e.currentTarget.textContent = soundOn ? '🔔' : '🔕';
        });

        document.querySelectorAll('.filter-btn').forEach(b => {
            b.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                filter = b.dataset.filter;
                render();
            });
        });

        const q = query(collection(db, 'commandes-table'), orderBy('createdAt', 'desc'));
        onSnapshot(q, (snap) => {
            allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            if (!firstLoad) {
                snap.docChanges().forEach((c) => {
                    if (c.type === 'added' && c.doc.data().status === 'nouvelle' && !knownIds.has(c.doc.id)) {
                        playBeep();
                    }
                });
            }
            knownIds = new Set(allOrders.map(o => o.id));
            firstLoad = false;
            render();
        }, (err) => {
            console.error(err);
            grid.innerHTML = `<p class="empty">Erreur : ${err.message}</p>`;
        });

        function render() {
            const visible = allOrders.filter(o => filter === 'all' || o.status !== 'servie');
            countBadge.textContent = visible.length === 0
                ? 'Aucune commande active'
                : `${visible.length} commande${visible.length > 1 ? 's' : ''}`;

            // Total plats à préparer = nouvelle + en-cours (peu importe le filtre, on veut ce qui reste à sortir)
            renderTotals();

            if (visible.length === 0) {
                grid.innerHTML = '<p class="empty">Aucune commande pour le moment.</p>';
                return;
            }

            // Sort: par jour décroissant (aujourd'hui d'abord), puis par status, puis par heure
            const order = { nouvelle: 0, 'en-cours': 1, servie: 2 };
            const dayKey = (ts) => {
                const d = new Date(ts);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            };
            visible.sort((a, b) => {
                const ka = dayKey(a.createdAt?.toMillis?.() || 0);
                const kb = dayKey(b.createdAt?.toMillis?.() || 0);
                if (ka !== kb) return ka < kb ? 1 : -1; // jour le plus récent d'abord
                const so = (order[a.status] ?? 9) - (order[b.status] ?? 9);
                if (so !== 0) return so;
                return (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0);
            });

            // Si filtre = 'all', on insère des séparateurs de jour
            if (filter === 'all') {
                const groups = new Map(); // dayKey -> orders[]
                visible.forEach(o => {
                    const k = dayKey(o.createdAt?.toMillis?.() || 0);
                    if (!groups.has(k)) groups.set(k, []);
                    groups.get(k).push(o);
                });
                const todayKey = dayKey(Date.now());
                const yesterdayKey = dayKey(Date.now() - 86400000);
                const dayLabel = (k) => {
                    if (k === todayKey) return "Aujourd'hui";
                    if (k === yesterdayKey) return "Hier";
                    const [y, m, d] = k.split('-');
                    return new Date(+y, +m - 1, +d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                };
                let html = '';
                for (const [k, orders] of groups) {
                    const dayTotal = orders.reduce((s, o) => s + (o.total || 0), 0);
                    const totalTxt = dayTotal.toFixed(2).replace('.', ',') + ' €';
                    html += `<div class="day-sep"><span>${dayLabel(k)}</span><span class="day-count">${orders.length} commande${orders.length > 1 ? 's' : ''} · <strong style="color:var(--ember-glow); font-style:italic;">${totalTxt}</strong></span></div>`;
                    html += orders.map(o => renderCard(o)).join('');
                }
                grid.innerHTML = html;
            } else {
                grid.innerHTML = visible.map(o => renderCard(o)).join('');
            }
            attachActions();
        }

        function renderTotals() {
            const active = allOrders.filter(o => o.status === 'nouvelle' || o.status === 'en-cours');
            const tally = new Map(); // name -> qty
            active.forEach(o => (o.items || []).forEach(it => {
                tally.set(it.name, (tally.get(it.name) || 0) + (it.qty || 0));
            }));
            const sorted = [...tally.entries()].sort((a, b) => b[1] - a[1]);
            const totalDishes = sorted.reduce((s, [, q]) => s + q, 0);

            const meta = document.getElementById('totals-meta');
            const body = document.getElementById('totals-body');
            if (active.length === 0) {
                meta.textContent = '— aucune commande active';
                body.innerHTML = '<p class="totals-empty">Pas de plats à préparer.</p>';
                return;
            }
            meta.textContent = `— ${totalDishes} plat${totalDishes > 1 ? 's' : ''} sur ${active.length} commande${active.length > 1 ? 's' : ''}`;
            body.innerHTML = sorted.map(([name, qty]) => `
                <div class="totals-row">
                    <span class="name">${esc(name)}</span>
                    <span class="qty">${qty}×</span>
                </div>
            `).join('');
        }

        // Toggle panneau total
        document.getElementById('totals-head').addEventListener('click', () => {
            const panel = document.getElementById('totals-panel');
            const toggle = document.getElementById('totals-toggle');
            const collapsed = panel.classList.toggle('collapsed');
            toggle.textContent = collapsed ? 'Afficher ▾' : 'Masquer ▴';
            try { localStorage.setItem('cuisine-totals-collapsed', collapsed ? '1' : '0'); } catch(e) {}
        });
        // Restore état précédent
        try {
            if (localStorage.getItem('cuisine-totals-collapsed') === '1') {
                document.getElementById('totals-panel').classList.add('collapsed');
                document.getElementById('totals-toggle').textContent = 'Afficher ▾';
            }
        } catch(e) {}

        // Renvoie un libellé temps adapté à l'âge de la commande
        function fmtTime(ts) {
            const now = new Date();
            const d = new Date(ts);
            const diffMs = now - d;
            const min = Math.floor(diffMs / 60000);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const cmdDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const dayDiff = Math.round((today - cmdDay) / 86400000);
            const hhmm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const ddmm = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });

            // Libellé court principal
            let short;
            if (min < 1 && dayDiff === 0) short = "à l'instant";
            else if (min < 60 && dayDiff === 0) short = `il y a ${min} min`;
            else if (dayDiff === 0) short = `à ${hhmm}`;
            else if (dayDiff === 1) short = `Hier ${hhmm}`;
            else short = `${ddmm} ${hhmm}`;

            return { short, hhmm, ddmm, dayDiff, min };
        }

        function renderCard(o) {
            const ts = o.createdAt?.toMillis?.() || Date.now();
            const t = fmtTime(ts);
            // Alerte rouge uniquement pour commandes ACTIVES de plus de 15 min
            const alert = (t.min >= 15 && (o.status === 'nouvelle' || o.status === 'en-cours')) ? 'alert' : '';
            const who = o.firstName ? ` · ${esc(o.firstName)}` : '';
            // Pour les vieilles commandes (>1h ou autre jour), affiche aussi l'heure brute en sous-ligne
            const detail = (t.dayDiff > 0 || t.min >= 60)
                ? `<span class="time-detail">il y a ${t.min} min</span>`
                : (t.dayDiff === 0 && t.min >= 1 ? `<span class="time-detail">à ${t.hhmm}</span>` : '');

            // Header : "Table N · Lucas" ou "À emporter · Lucas (dans 30 min)"
            const isTogo = o.mode === 'togo';
            const headerLabel = isTogo
                ? `À emporter${who}<span class="mode-badge togo">À EMPORTER</span>${o.pickupTime ? ` <span style="color:var(--ember-glow); font-style:italic; font-size:0.85rem; font-family:Manrope; font-weight:500;">· ${esc(o.pickupTime)}</span>` : ''}`
                : `Table ${esc(o.table)}${who}`;

            return `
                <article class="card ${o.status}">
                    <div class="card-head">
                        <span class="table-num">${headerLabel}</span>
                        <span class="time ${alert}" style="text-align:right;">
                            ${t.short}
                            ${detail}
                        </span>
                    </div>
                    <ul class="items">
                        ${o.items.map(it => {
                            const mods = it.mods ? Object.values(it.mods).filter(Boolean).join(' · ') : '';
                            const modsHtml = mods ? `<div style="color: var(--ember-glow); font-size: 0.85rem; font-style: italic; margin-left: 1.6rem; margin-top: 0.1rem;">→ ${esc(mods)}</div>` : '';
                            return `<li><span class="qty">${it.qty}×</span>${esc(it.name)}${modsHtml}</li>`;
                        }).join('')}
                    </ul>
                    ${o.note ? `<p class="note">📝 ${esc(o.note)}</p>` : ''}
                    <div class="foot">
                        <span class="total">${o.total.toFixed(2).replace('.', ',')} €</span>
                        <div class="actions">
                            ${o.status === 'nouvelle'
                                ? `<button type="button" class="btn btn-cooking" data-id="${o.id}" data-status="en-cours">En préparation</button>` : ''}
                            ${o.status !== 'servie'
                                ? `<button type="button" class="btn btn-done" data-id="${o.id}" data-status="servie">Servie ✓</button>`
                                : `<button type="button" class="btn btn-undo" data-id="${o.id}" data-status="en-cours">↶ Réactiver</button>`}
                        </div>
                    </div>
                </article>
            `;
        }

        function attachActions() {
            document.querySelectorAll('.btn[data-id]').forEach(b => {
                b.addEventListener('click', async () => {
                    b.disabled = true;
                    try {
                        await updateDoc(doc(db, 'commandes-table', b.dataset.id), {
                            status: b.dataset.status,
                            updatedAt: serverTimestamp()
                        });
                    } catch (err) {
                        alert('Erreur : ' + err.message);
                        b.disabled = false;
                    }
                });
            });
        }

        // Auto-refresh times
        setInterval(render, 30000);

        function playBeep() {
            if (!soundOn) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.value = 0.3;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
    </script>
</body>
</html>
